name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Create Correct google-services.json
      run: |
        mkdir -p app/src/debug
        cat <<EOF > app/src/debug/google-services.json
        {
          "project_info": {
            "project_number": "1234567890",
            "project_id": "tindago-app",
            "storage_bucket": "tindago-app.appspot.com"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:1234567890:android:1234567890abcdef",
                "android_client_info": {
                  "package_name": "com.aistudio.marketgreen.shpmnt"
                }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "AIzaSyDummyKeyForBuildOnly12345" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }
          ],
          "configuration_version": "1"
        }
        EOF

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TindaGo-App
        path: app/build/outputs/apk/debug/app-debug.apk
